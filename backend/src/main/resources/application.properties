# Application
spring.application.name=expense-tracker-api
server.port=${PORT:8080}

# Active profile: 'local' for dev (H2), 'prod' for deployment (PostgreSQL)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# JWT
app.jwt.secret=${JWT_SECRET:dGhpc2lzYXZlcnl2YWxpZGI2NHNlY3JldGtleWZvcmp3dGhzbWFydGV4cGVuc2V0cmFja2VyYXBwbGljYXRpb24=}
app.jwt.expiration-ms=86400000

# CORS
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# OTP verification (dev-mode=true → OTP returned in API response; set false in prod)
app.otp.dev-mode=${OTP_DEV_MODE:true}

# Mail (SMTP — only active when spring.mail.host is set, i.e. prod profile)
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# JPA common
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
