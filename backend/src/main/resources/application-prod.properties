# ── PRODUCTION profile (PostgreSQL) ─────────────────────────────────────────
# Railway injects DATABASE_URL automatically; we remap it to Spring Boot vars.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.h2.console.enabled=false

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Mail — only creates JavaMailSender bean when MAIL_HOST is explicitly set in Railway env vars.
# Without it, EmailService falls back to console logging (no crash, no auth error).
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
app.otp.dev-mode=${OTP_DEV_MODE:false}
