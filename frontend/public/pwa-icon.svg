<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Blue background -->
  <rect width="512" height="512" rx="96" fill="#2563eb"/>
  <!-- Subtle inner shine -->
  <rect x="0" y="0" width="512" height="256" rx="96" fill="url(#shine)" opacity="0.15"/>
  <defs>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="white"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Rupee symbol -->
  <text
    x="256"
    y="345"
    font-family="'Segoe UI', 'Arial', sans-serif"
    font-size="290"
    font-weight="700"
    fill="white"
    text-anchor="middle"
    dominant-baseline="auto"
    opacity="0.97"
  >&#x20B9;</text>
  <!-- Small upward trend line at bottom-right -->
  <polyline
    points="310,400 360,360 400,375 450,330"
    fill="none"
    stroke="white"
    stroke-width="18"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.5"
  />
</svg>
